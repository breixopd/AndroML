name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

env:
  STORE_SUBMISSIONS_ENABLED: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Assert test-period release policy
        run: test "$STORE_SUBMISSIONS_ENABLED" = 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Verify release configuration
        run: ./scripts/verify-release-config.sh

      - name: Verify code and OSS debug build
        run: ./scripts/verify-all.sh --ci

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: androml-oss-debug-apk
          path: |
            app/build/outputs/apk/oss/debug/app-oss-universal-debug.apk
            app/build/outputs/apk/oss/debug/app-oss-arm64-v8a-debug.apk
          if-no-files-found: error
