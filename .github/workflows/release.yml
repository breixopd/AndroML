name: GitHub Release recovery

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub Release tag to rebuild and re-upload
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: github-release-recovery-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  STORE_SUBMISSIONS_ENABLED: 'false'
  RELEASE_TAG: ${{ inputs.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag input
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Block store publication
        run: test "$STORE_SUBMISSIONS_ENABLED" = 'false'

      - name: Require test-release signing inputs
        env:
          ANDROML_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROML_RELEASE_KEYSTORE_B64 }}
          ANDROML_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROML_RELEASE_STORE_PASSWORD }}
          ANDROML_RELEASE_KEY_ALIAS: ${{ secrets.ANDROML_RELEASE_KEY_ALIAS }}
          ANDROML_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROML_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROML_RELEASE_KEYSTORE_B64"
          test -n "$ANDROML_RELEASE_STORE_PASSWORD"
          test -n "$ANDROML_RELEASE_KEY_ALIAS"
          test -n "$ANDROML_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROML_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/androml-test-release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Verify tagged source
        run: ./scripts/verify-all.sh --ci

      - name: Build OSS release APK
        env:
          ANDROML_PREPARE_LLAMA_CPP: 'true'
          ANDROML_RELEASE_KEYSTORE: ${{ runner.temp }}/androml-test-release.jks
          ANDROML_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROML_RELEASE_STORE_PASSWORD }}
          ANDROML_RELEASE_KEY_ALIAS: ${{ secrets.ANDROML_RELEASE_KEY_ALIAS }}
          ANDROML_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROML_RELEASE_KEY_PASSWORD }}
        run: ./scripts/build-test-release.sh

      - name: Package and verify test artifact
        run: |
          ./scripts/verify-release-config.sh
          ./scripts/package-test-release.sh "${RELEASE_TAG#v}"

      - name: Assert release contains only GitHub test artifacts
        run: |
          test "$STORE_SUBMISSIONS_ENABLED" = 'false'
          test "$(find dist/test-release -maxdepth 1 -type f | wc -l)" -ge 11

      - name: Attest release binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/test-release/*.apk
            dist/test-release/*.aab

      - name: Confirm existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' | grep -Fx "$RELEASE_TAG"

      - name: Upload verified assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/test-release/* --clobber
